<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Vampiripavia.com</title>
  <!-- exact legacy stylesheet + assets -->
  <link rel="stylesheet" href="/legacy-assets/stili.css">
  <style>
    body { background: #000; }
    .bar { background: #444444; text-align: center; }
    #mappa { width: 100%; text-align: center; margin: 20px auto; }
    #mappa img { max-width: 100%; border: 0; }
    #nav_mappa { text-align: center; }
    #nav_mappa h5 { display: inline-block; padding: 12px; }
    a.mappe, a.plain_e { color: #ccc; text-decoration: none; }
    a.mappe:hover, a.plain_e:hover { color: #761919; }
  </style>
</head>
<body bgcolor="#000000">
  <div id="page"></div>

  <script>
    var P = new URLSearchParams(location.search);
    var p = P.get("p") || "help";
    var room = P.get("room") || "elysium";

    var ROOM_NAMES = { elysium: "Elysium", strada: "Strada" };
    // demo room descriptions (legacy stanza.php pulls these from the stanze table)
    var ROOM_DESC = {
      elysium: "Il cuore neutrale della citt&agrave;, dove i Dannati depongono le armi e parlano sotto la legge del Principe.",
      strada: "Le vie buie oltre l'Elysium, dove le regole si fanno pi&ugrave; sottili e il sangue scorre pi&ugrave; facile.",
    };

    // legacy header bar: class="medium" bgcolor #444444, bold, centered
    var bar = function (text) {
      return '<table border="0" cellpadding="0" cellspacing="0" width="100%"><tr>' +
        '<td class="medium bar" height="20"><b>' + text + '</b></td></tr></table>';
    };
    // legacy "Chiudi": small font, centered, with spacing above (help/bacheca/news/stanza)
    var chiudi = '<div class="small" style="text-align:center"><br><br><a href="javascript:self.close()" class="plain_e">Chiudi</a></div>';

    var page = document.getElementById("page");
    if (p === "mappa") {
      document.title = "Mappa dell' Elysium";
      page.innerHTML =
        '<div id="nav_mappa"><ul><li class="nav_mappa_lista"><h5><a class="mappe">Mappa</a></h5></li></ul></div>' +
        '<div id="mappa"><img src="/legacy-assets/images/elysium1e2.jpg" alt="Mappa Elysium"></div>';
    } else if (p === "stanza") {
      document.title = "Vampiripavia.com";
      page.innerHTML = bar((ROOM_NAMES[room] || room).toUpperCase()) +
        '<div class="small" id="vp-desc" style="padding:16px">Caricamento...</div>' + chiudi;
      // legacy stanza.php pulls nome + descrizione from the stanze table
      fetch("/rooms").then(function (r) { return r.json(); }).then(function (d) {
        var rm = (d.rooms || []).find(function (x) { return x.id === room; });
        var head = document.querySelector(".bar");
        if (head && rm) head.innerHTML = "<b>" + (rm.name || room).toUpperCase() + "</b>";
        var el = document.getElementById("vp-desc");
        if (el) el.innerHTML = (rm && rm.descrizione) ? rm.descrizione : "Nessuna descrizione disponibile.";
      }).catch(function () {});
    } else if (p === "crea") {
      document.title = "Creazione personaggio";
      page.innerHTML = bar("CREAZIONE PERSONAGGIO") +
        '<div class="small" style="padding:16px;text-align:center"><br>La creazione del personaggio non è ancora disponibile in questa fase.<br>Contatta un Master per un accesso di prova.</div>' + chiudi;
    } else {
      // help, bacheca and news share the legacy help template header
      document.title = p === "bacheca" ? "Bacheca" : p === "news" ? "Giornali" : "Help";
      page.innerHTML = bar("LA CHAT DI VAMPIRIPAVIA") + chiudi;
    }
  </script>
</body>
</html>
