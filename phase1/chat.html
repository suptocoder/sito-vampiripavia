<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Elysium</title>
  <!-- reuse the legacy stylesheet verbatim; its url(imgs/..) resolves under /legacy-assets/ -->
  <link rel="stylesheet" href="/legacy-assets/stili.css">
  <style>
    /* Only the frameset geometry from chat.php lives here. Colours, fonts, buttons,
       headings, user rows all come from stili.css above. Numbers are the exact
       legacy frame sizes: right 270, location 180, banner 99, meteo 80, pannello 115. */
    html, body { height: 100%; }
    body { background: #000; overflow: hidden; }
    a { cursor: pointer; }

    #vp-banner {
      position: fixed; top: 0; left: 0; right: 350px; height: 99px;
      background: #fff url("/legacy-assets/imgs/header_banner.jpg") right bottom / auto 99px no-repeat;
      border-bottom: 1px solid #777;
    }
    #vp-meteo {
      position: fixed; top: 0; right: 270px; width: 80px; height: 99px;
      border-bottom: 1px solid #777; border-left: 1px solid #777;
      background: #000 url("/legacy-assets/images/luna/luna3nuvoloso.jpg") center / cover no-repeat;
    }

    #vp-location {
      position: fixed; top: 99px; left: 0; width: 180px; bottom: 116px;
      overflow: auto; border-right: 1px solid #222;
    }
    #vp-main {
      position: fixed; top: 99px; left: 180px; right: 270px; bottom: 116px;
      overflow: auto;
    }
    #messages { padding: 4px 10px; }
    #messages br { line-height: 1.6; }

    #vp-pannello {
      position: fixed; top: 0; right: 0; width: 270px; height: 115px;
      border-left: 1px solid #777; border-bottom: 1px solid #777;
      text-align: center;
    }
    #vp-lista {
      position: fixed; top: 115px; right: 0; width: 270px; bottom: 116px;
      overflow: auto; border-left: 1px solid #777;
    }

    #vp-command {
      position: fixed; left: 0; right: 0; bottom: 0; height: 116px;
      border-top: 1px solid #777; padding: 8px 10px; box-sizing: border-box;
    }

    #status { padding: 4px 10px; min-height: 16px; }

    #vp-command #logout { float: right; margin-left: 10px; cursor: pointer; }
    #vp-command #logout img { display: block; height: 64px; width: auto; border: 0; }
    #vp-command #rcpt { display: block; width: 60%; max-width: 480px; margin-bottom: 5px; }
    #vp-command .cmd-row { display: flex; align-items: center; gap: 6px; }
    #vp-command #msg { flex: 1; max-width: 480px; }
    #vp-command #uscita { display: inline-block; margin-top: 6px; }

    /* Modern gradient for the legacy .button (its -webkit-gradient/-moz- rules are dead in
       current browsers). Same colours as stili.css intended: #000 -> #731010, hover reversed. */
    .button { background-image: linear-gradient(#000 5%, #731010 100%) !important; }
    .button:hover { background-image: linear-gradient(#731010 5%, #000 100%) !important; }
    .button:disabled { opacity: .4; cursor: not-allowed; }

    /* legacy banner announcement (dark text over the white left side of the banner) */
    #vp-banner .vp-banner-text {
      position: absolute; top: 8px; left: 10px; right: 380px;
      color: #000; font: 13px Arial, Helvetica, sans-serif;
      white-space: pre-line; line-height: 1.55;
    }

    /* legacy XP ankh sign below the pannello buttons */
    #vp-ankh { text-align: center; padding: 8px 0 4px; }
    #vp-ankh img { height: 46px; width: auto; }
  </style>
</head>
<body>
  <div id="vp-banner"><div class="vp-banner-text">Aggiungete il Mezzo di trasporto nel campo RIFUGIO della Scheda!
Piu concisi possibili, grazie!

INSERIRE CORRETTAMENTE I CAMPI BG E RIFUGIO, E LA FASCIA SOCIALI IN DESCRIZIONE

INVIATE I RESOCONTI!</div></div>
  <div id="vp-meteo"></div>

  <div id="vp-location">
    <h5>LUOGHI ADIACENTI</h5>
    <ul class="luoghi" id="luoghi"></ul>
  </div>

  <div id="vp-main">
    <h5 id="roomName" style="text-align:center"></h5>
    <div id="messages"></div>
  </div>

  <div id="vp-pannello">
    <div id="tabAnk">
      <table border="0" cellpadding="0" cellspacing="0" align="center">
        <tr>
          <td><input type="button" value="Scheda" class="button" data-btn="scheda"></td>
          <td><input type="button" value="Mappa" class="button" data-btn="mappa"></td>
          <td><input type="button" value="Stanza" class="button" data-btn="stanza"></td>
        </tr>
        <tr>
          <td><input type="button" value="Bacheca" class="button" data-btn="bacheca"></td>
          <td><input type="button" value="Help" class="button" data-btn="help"></td>
          <td><input type="button" value="Giornali" class="button" data-btn="giornali"></td>
        </tr>
      </table>
    </div>
  </div>

  <div id="vp-lista">
    <div id="vp-ankh"><img src="/legacy-assets/imgs/ankh_white.png" alt=""></div>
    <div id="status" class="entrata"></div>
    <h5 id="rosterTitle">0 UTENTI IN ELYSIUM</h5>
    <ul id="roster"></ul>
  </div>

  <div id="vp-command">
    <form id="msgForm">
      <a id="logout" title="Esci"><img src="/legacy-assets/images/logout.jpg" alt="logout"></a>
      <input type="text" id="rcpt" class="form_hidden" value="" readonly size="47">
      <div class="cmd-row">
        <input type="text" id="msg" class="textfield_grande" autocomplete="off">
        <input type="submit" value="Invia" class="button">
        <input type="button" id="whisper" value="Sussurra ai Master" class="button">
      </div>
      <span class="small_rosso" id="uscita">Uscita</span>
    </form>
  </div>

  <script src="/vp-config.js"></script>
  <script src="/chat.js?v=20260703-auth"></script>
</body>
</html>
